[project]
name = "orderflow-alert"
version = "0.1.0"
description = "Read-only order-flow alerts for NQ/ES futures from the TradeStation 1-minute bar stream: delta, cumulative delta, and single-print (double distribution) alerts, with a local live panel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orderflow-alert = "orderflow_alert.flow_alert:main"
orderflow-login = "orderflow_alert.tradestation:login_main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["orderflow_alert*"]

[tool.setuptools.package-data]
orderflow_alert = ["*.html"]
